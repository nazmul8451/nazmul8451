<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Nazmul Islam Rimon — Flutter Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0A1F3D"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#7FDBFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13B9FD"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B2B47"/>
      <stop offset="0.5" stop-color="#3A5C94"/>
      <stop offset="1" stop-color="#1B2B47"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="2.2s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#FFFFFF" opacity="0.07"/></pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="22"/></clipPath>
    <clipPath id="screen"><rect x="958" y="52" width="150" height="262" rx="18"/></clipPath>
  </defs>
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .l{opacity:0;animation:cycle 12s infinite}
    .l2{animation-delay:4s}.l3{animation-delay:8s}
    @keyframes cycle{0%{opacity:0;transform:translateY(10px)}4%,29%{opacity:1;transform:translateY(0)}33%,100%{opacity:0;transform:translateY(-10px)}}
    .chip{opacity:0;animation:rise .8s ease-out forwards}
    .c1{animation-delay:.3s}.c2{animation-delay:.5s}.c3{animation-delay:.7s}.c4{animation-delay:.9s}.c5{animation-delay:1.1s}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .phone{animation:float 6s ease-in-out infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    .caret{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .pulse{animation:pulse 2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.6)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.l1,.chip{opacity:1}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <g filter="url(#blur)">
      <circle cx="180" cy="60" r="150" fill="#02569B" opacity="0.75">
        <animate attributeName="cx" values="180;320;180" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;150;60" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1020" cy="270" r="170" fill="#13B9FD" opacity="0.45">
        <animate attributeName="cx" values="1020;880;1020" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="270;180;270" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle cx="640" cy="340" r="130" fill="#7C4DFF" opacity="0.4">
        <animate attributeName="cx" values="640;520;700;640" dur="20s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <g class="chip c1">
      <rect x="64" y="50" width="246" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.07" stroke="#FFFFFF" stroke-opacity="0.16"/>
      <circle class="pulse" cx="84" cy="66" r="5" fill="#3DDC84"/>
      <text x="100" y="71" class="f" font-size="14" font-weight="600" fill="#DCE7F5" letter-spacing="0.4">Available for new projects</text>
    </g>

    <text x="62" y="150" class="f" font-size="68" font-weight="800" fill="url(#name)" letter-spacing="-1.5">Nazmul Islam Rimon</text>
    <rect x="64" y="170" width="0" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="0;220" dur="1.2s" begin="0.3s" fill="freeze"/>
    </rect>

    <g class="mono" font-size="23" fill="#B9D4F1">
      <text x="64" y="218" fill="#13B9FD">&gt;</text>
      <text x="88" y="218" class="l l1">Flutter Developer for Android &amp; iOS</text>
      <text x="88" y="218" class="l l2">From the first pixel to the Play Store &amp; App Store</text>
      <text x="88" y="218" class="l l3">Creator of TurfPlay, live on Google Play</text>
    </g>

    <g class="f" font-size="14" font-weight="600" fill="#DCE7F5">
      <g class="chip c2"><rect x="64" y="250" width="82" height="30" rx="15" fill="#13B9FD" fill-opacity="0.16" stroke="#13B9FD" stroke-opacity="0.5"/><text x="105" y="270" text-anchor="middle">Flutter</text></g>
      <g class="chip c3"><rect x="156" y="250" width="66" height="30" rx="15" fill="#13B9FD" fill-opacity="0.16" stroke="#13B9FD" stroke-opacity="0.5"/><text x="189" y="270" text-anchor="middle">Dart</text></g>
      <g class="chip c4"><rect x="232" y="250" width="92" height="30" rx="15" fill="#7C4DFF" fill-opacity="0.18" stroke="#7C4DFF" stroke-opacity="0.55"/><text x="278" y="270" text-anchor="middle">Firebase</text></g>
      <g class="chip c5"><rect x="334" y="250" width="160" height="30" rx="15" fill="#7C4DFF" fill-opacity="0.18" stroke="#7C4DFF" stroke-opacity="0.55"/><text x="414" y="270" text-anchor="middle">REST &amp; WebSockets</text></g>
    </g>

    <g class="mono" font-size="15" fill="#7FDBFF" opacity="0.55">
      <text x="740" y="92">void main() =&gt;</text>
      <text x="756" y="114">runApp(MyApp());<tspan class="caret" fill="#13B9FD"> |</tspan></text>
    </g>

    <g class="phone">
      <rect x="950" y="44" width="166" height="300" rx="26" fill="#0B1424" stroke="#3A5683" stroke-width="2"/>
      <g clip-path="url(#screen)">
        <rect x="958" y="52" width="150" height="262" fill="#0F1B30"/>
        <rect x="1008" y="60" width="50" height="8" rx="4" fill="#05080F"/>
        <rect x="970" y="84" width="126" height="64" rx="12" fill="url(#accent)" opacity="0.9"/>
        <rect x="982" y="98" width="60" height="8" rx="4" fill="#FFFFFF" opacity="0.9"/>
        <rect x="982" y="114" width="88" height="6" rx="3" fill="#FFFFFF" opacity="0.55"/>
        <rect x="982" y="128" width="40" height="6" rx="3" fill="#FFFFFF" opacity="0.55"/>
        <rect x="970" y="160" width="126" height="34" rx="9" fill="#16243D"/>
        <circle cx="987" cy="177" r="9" fill="url(#shine)"/>
        <rect x="1004" y="169" width="70" height="6" rx="3" fill="url(#shine)"/>
        <rect x="1004" y="181" width="44" height="5" rx="2.5" fill="url(#shine)"/>
        <rect x="970" y="202" width="126" height="34" rx="9" fill="#16243D"/>
        <circle cx="987" cy="219" r="9" fill="url(#shine)"/>
        <rect x="1004" y="211" width="58" height="6" rx="3" fill="url(#shine)"/>
        <rect x="1004" y="223" width="76" height="5" rx="2.5" fill="url(#shine)"/>
        <rect x="970" y="244" width="126" height="34" rx="9" fill="#16243D"/>
        <circle cx="987" cy="261" r="9" fill="url(#shine)"/>
        <rect x="1004" y="253" width="66" height="6" rx="3" fill="url(#shine)"/>
        <rect x="1004" y="265" width="38" height="5" rx="2.5" fill="url(#shine)"/>
        <circle cx="1078" cy="292" r="15" fill="#13B9FD">
          <animate attributeName="r" values="15;17;15" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <path d="M1078 285v14M1071 292h14" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
      </g>
    </g>
  </g>
</svg>
